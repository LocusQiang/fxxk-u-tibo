name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python regressions (isolated, no Codex access)
        run: python -X utf8 -m unittest discover -p 'test_*.py'
      - name: Native pipe integration (mock server)
        run: node --test test_bridge.cjs
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Build source distribution
        run: python package_release.py
      - name: Windows PowerShell lifecycle and task ownership checks
        shell: powershell
        run: |
          ./scripts/test-scripts.ps1
          ./scripts/test-exe-autostart.ps1
  executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-build.txt
      - run: python build_exe.py
      - run: python package_release.py
      - name: Check bundled runtime without sending
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/*-windows-x64.exe).FullName
          $process = Start-Process -FilePath $exe -ArgumentList '--doctor --output dist/ci-doctor.json' -PassThru -Wait
          $report = Get-Content dist/ci-doctor.json -Raw | ConvertFrom-Json
          $runtime = $report.checks | Where-Object { $_.check -in @('platform','python','tkinter','PIL','node','assets') }
          if ($runtime.Count -ne 6 -or ($runtime | Where-Object status -ne 'ok')) { throw 'Bundled runtime check failed.' }
          if ($report.messages_sent -ne 0) { throw 'Doctor must be read-only.' }
